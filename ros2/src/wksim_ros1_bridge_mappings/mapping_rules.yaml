# Name changes are recorded in prometheus_msgs/UPSTREAM.json; message bytes
# and frozen message overlays are unchanged by this separate mapping package.
- enable_foreign_mappings: true
  ros1_package_name: prometheus_msgs
  ros1_message_name: BoundingBox
  ros2_package_name: prometheus_msgs
  ros2_message_name: BoundingBox
  fields_1_to_2:
    Class: class_name
    probability: probability
    xmin: xmin
    ymin: ymin
    xmax: xmax
    ymax: ymax
- enable_foreign_mappings: true
  ros1_package_name: prometheus_msgs
  ros1_message_name: DetectionInfoSub
  ros2_package_name: prometheus_msgs
  ros2_message_name: DetectionInfoSub
  fields_1_to_2:
    left: left
    top: top
    bot: bot
    right: right
    trackIds: track_ids
